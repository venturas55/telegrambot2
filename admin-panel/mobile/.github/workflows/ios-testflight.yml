name: RITMO iOS — build and TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Subir a TestFlight tras compilar (desmarcar para descargar IPA solamente)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ritmo-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Build IPA on macOS
    runs-on: macos-26
    timeout-minutes: 90

    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'

      # Compilar React Native desde código fuente
      RCT_USE_RN_DEP: '0'
      RCT_USE_PREBUILT_RNCORE: '0'
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Seleccionar y verificar Xcode
        env:
          XCODE_APP: ${{ vars.XCODE_APP || '/Applications/Xcode_26.6.app' }}
        run: |
          test -d "$XCODE_APP/Contents/Developer"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --find xcodebuild
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and Expo config
        run: |
          npm run typecheck
          npx expo config --type public --json > /tmp/ritmo-expo-config.json
          python3 scripts/verify_expo_config.py /tmp/ritmo-expo-config.json

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod --version
          pod install --repo-update 2>&1 | tee "$RUNNER_TEMP/ritmo-pods.log"

      - name: Diagnosticar modulemaps de Expo
        run: |
          # Built-product module maps can appear only during compilation.
          # Inspect pod support files here without requiring build output yet.
          find ios/Pods -name '*EXApplication*' -print
          find ios/Pods -name '*.modulemap' -print

      - name: Verificar workspace de CocoaPods
        shell: bash
        run: |
          set -euo pipefail

          test -d ios/Ritmo.xcworkspace || {
            echo "::error::Falta ios/Ritmo.xcworkspace"
            exit 1
          }

          test -f ios/Pods/Pods.xcodeproj/project.pbxproj || {
            echo "::error::Falta el proyecto Pods"
            exit 1
          }

          echo "Workspace correcto:"
          ls -ld ios/Ritmo.xcworkspace

          echo "Esquemas disponibles:"
          xcodebuild -list -workspace ios/Ritmo.xcworkspace
          
      - name: Importar certificado y provisioning profile
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/ios_prepare_signing.sh

      - name: Verificar permisos del perfil instalado
        shell: bash
        run: |
          set -euo pipefail

          : "${PROFILE_UUID:?Missing PROFILE_UUID}"
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          if [ ! -f "$PROFILE" ]; then
            echo "::error::No se encuentra el perfil instalado"
            exit 1
          fi

          security cms -D -i "$PROFILE" > /tmp/ritmo-profile.plist

          APS=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:aps-environment" \
            /tmp/ritmo-profile.plist)

          echo "aps-environment: $APS"

          if [ "$APS" != "production" ]; then
            echo "::error::El perfil no tiene Push Notifications para producción"
            exit 1
          fi

          echo "Perfil de aprovisionamiento verificado correctamente."
      - name: Archive and export IPA
        run: bash scripts/ios_build_archive.sh

      - name: Guardar diagnóstico de Xcode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-ios-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ritmo-archive.log
            ${{ runner.temp }}/ritmo-pods.log
            ${{ runner.temp }}/RitmoArchive.xcresult
            ios/Podfile
            ios/Podfile.lock
          if-no-files-found: ignore
          retention-days: 7

      - name: Descargar IPA desde GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-ios-ipa-${{ github.run_number }}
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Subir a TestFlight
        if: ${{ inputs.upload_testflight }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: output/Ritmo.ipa
          issuer-id: ${{ vars.ASC_ISSUER_ID }}
          api-key-id: ${{ vars.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: Cleanup keychain and profile
        if: always()
        run: |
          if [ -n "${SIGNING_PROFILE_PATH:-}" ]; then rm -f "$SIGNING_PROFILE_PATH"; fi
          security delete-keychain "$RUNNER_TEMP/ritmo-signing.keychain-db" 2>/dev/null || true
