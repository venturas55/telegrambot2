name: Buscaviento iOS - Ad Hoc iPhone

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buscaviento-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Build IPA Ad Hoc
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: admin-panel/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
      RCT_USE_RN_DEP: '0'
      RCT_USE_PREBUILT_RNCORE: '0'
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project directory
        run: |
          test -f package.json || { echo 'Missing admin-panel/mobile/package.json'; exit 1; }
          test -f package-lock.json || { echo 'Missing package-lock.json required by npm ci'; exit 1; }
          test -f app.json || test -f app.config.js || test -f app.config.ts || { echo 'Expo config not found'; exit 1; }
          test -f scripts/ios_prepare_signing.sh
          test -f scripts/ios_build_archive.sh
          test -f scripts/verify_expo_config.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-panel/mobile/package-lock.json

      - name: Select Xcode
        run: |
          XCODE_APP="${XCODE_APP:-/Applications/Xcode_26.6.app}"
          if [ -d "$XCODE_APP/Contents/Developer" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "Requested Xcode path not found: $XCODE_APP; using installed default"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo config
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          python3 scripts/verify_expo_config.py "$RUNNER_TEMP/expo-config.json"

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update 2>&1 | tee "$RUNNER_TEMP/buscaviento-pods.log"

      - name: Prepare Ad Hoc signing
        run: bash scripts/ios_prepare_signing.sh

      - name: Archive and export Ad Hoc IPA
        run: bash scripts/ios_build_archive.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: buscaviento-adhoc-${{ github.run_number }}
          path: admin-panel/mobile/output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buscaviento-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/buscaviento-archive.log
            ${{ runner.temp }}/buscaviento-pods.log
            ${{ runner.temp }}/BuscavientoArchive.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup signing keychain and profile
        if: always()
        run: |
          if [ -n "${SIGNING_PROFILE_PATH:-}" ]; then rm -f "$SIGNING_PROFILE_PATH"; fi
          security delete-keychain "$RUNNER_TEMP/buscaviento-signing.keychain-db" 2>/dev/null || true
     
      - name: Verificar URL de la API
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Falta EXPO_PUBLIC_API_URL"
            exit 1
          fi
          echo "API configurada correctamente"